# Suite GGUF registry. Each row is tier 16gb or 24gb, the levels Model Forge publishes.
# min_vram_gb is what the file needs. The app keeps 2 GB free on a card under 24 GB
# and 3 GB free on a 24 GB card, and it hides a tier the card cannot run.
# Files land in <models>/llm (Linux ~/.local/share/voxprint/models/llm), the folder
# Audiobook Builder uses, and are checked by revision, size, and SHA-256.
# Licences were read from the Hugging Face model cards on 2026-10-10.
# Apache-2.0 and MIT only. An empty licence tag excludes the file.
# TheDrummer tunes (no licence tag) are not listed.
# YandexGPT-5-Lite (custom licence) is not listed.
# A quant whose repository tag is the Gemma licence, rather than Apache-2.0, is not listed.
# optional + uncensored rows are finished abliterated files, or disabled placeholders
# for files Model Forge has not published. Plotweaver does not abliterate or quantize.
# Settings offers an enabled least-censored file when the selected tier can run it.
# Least-censored rows come from Model Forge. Stock rows stay T-pro, Gemma 4 12B,
# and T-lite Q4/Q5. Disabled rows stay empty until a forge manifest fills them.

